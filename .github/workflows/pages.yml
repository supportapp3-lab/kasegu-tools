name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test calculation and validate source
        run: |
          node tests/bichiku.test.js
          node tests/pet-bichiku.test.js
          node tests/baby-bichiku.test.js
          node tests/toilet-bichiku.test.js
          node --check assets/js/bichiku.js
          node --check assets/js/pet-bichiku.js
          node --check assets/js/baby-bichiku.js
          node --check assets/js/toilet-bichiku.js
          python3 scripts/lint.py
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml _site/
          cp -R assets tools about privacy contact _site/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
