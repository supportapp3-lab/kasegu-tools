name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test calculation and validate source
        run: |
          node tests/bichiku.test.js
          node tests/custom-food-stock.test.js
          node tests/pet-bichiku.test.js
          node tests/baby-bichiku.test.js
          node tests/toilet-bichiku.test.js
          node tests/portable-power.test.js
          node tests/planter-soil.test.js
          node tests/paint-quantity.test.js
          node tests/wallpaper-quantity.test.js
          node tests/aquarium-volume.test.js
          node tests/rolling-stock.test.js
          node tests/ensei-hi.test.js
          node --check assets/js/bichiku.js
          node --check assets/js/custom-food-stock.js
          node --check assets/js/pet-bichiku.js
          node --check assets/js/baby-bichiku.js
          node --check assets/js/toilet-bichiku.js
          node --check assets/js/portable-power.js
          node --check assets/js/planter-soil.js
          node --check assets/js/paint-quantity.js
          node --check assets/js/wallpaper-quantity.js
          node --check assets/js/aquarium-volume.js
          node --check assets/js/rolling-stock.js
          node --check assets/js/ensei-hi.js
          python3 -m unittest discover -s tests -p 'test_build_sitemap.py' -v
          python3 scripts/lint.py
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml _site/
          python3 scripts/build_sitemap.py --out _site/sitemap.xml
          cp -R assets tools guides about privacy contact _site/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
